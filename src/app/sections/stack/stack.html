<section id="stack" class="chapter" aria-labelledby="stack-title">
  <div class="container">
    <div class="chapter-content" appReveal>
      <app-section-heading
        [eyebrow]="copy.eyebrow"
        [heading]="copy.heading"
        [lead]="copy.lead"
        headingId="stack-title"
      />

      <div class="option-list layers" role="tablist" aria-label="Data stack layers" (keydown)="onKeydown($event)">
        @for (layer of layers; track layer.id; let i = $index) {
          <button
            type="button"
            role="tab"
            class="option"
            [id]="'layer-tab-' + i"
            [class.is-active]="i === index()"
            [attr.aria-selected]="i === index()"
            aria-controls="layer-panel"
            [attr.tabindex]="i === index() ? 0 : -1"
            (click)="index.set(i)"
          >
            <span class="option-key">{{ num(i) }}</span>
            <span class="option-text">{{ layer.name }}</span>
          </button>
        }
      </div>

      <div id="layer-panel" class="panel detail" role="tabpanel" [attr.aria-labelledby]="'layer-tab-' + index()">
        @for (layer of [active()]; track layer?.id) {
          @if (layer) {
            <div class="panel-enter">
              <p class="mono-label">Layer {{ num(index()) }} / {{ num(layers.length - 1) }}</p>
              <h3 class="title">{{ layer.name }}</h3>
              <p class="summary">{{ layer.summary }}</p>
              <ul class="tag-list">
                @for (item of layer.items; track item) {
                  <li class="tag">{{ item }}</li>
                }
              </ul>
            </div>
          }
        }
      </div>
    </div>
  </div>
</section>
